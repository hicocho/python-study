<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダンジョン — python-study</title>
<meta name="description" content="部屋と廊下をランダムに作り、霧の中を歩いて階段を探すローグライク。地下 5 階でクリア。CLI 版と同じ Python がブラウザでそのまま動いています。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
<link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
<script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #656d76;
    --line: #d8dbe0;
    --accent: #2f6f4e;
    --warn: #9a6700;
    --wall: #6b5a45;
    --floor: #e9dcc3;
    --dim: #b8ad98;
    --dark: #1d2230;
    --player: #d2402a;
    --goal: #e0b341;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --panel: #1f2229;
      --ink: #e6e6e3;
      --muted: #9aa2ad;
      --line: #333842;
      --accent: #7fc9a1;
      --warn: #e0b341;
      --wall: #5a4a38;
      --floor: #a89a80;
      --dim: #4a4438;
      --dark: #0f1218;
      --player: #ff7a63;
      --goal: #f0c95a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 3rem;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: .875rem; margin: 0 0 1.5rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: .75rem;
    padding: 1.25rem;
  }
  .status { display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: .75rem; font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status b { color: var(--ink); font-weight: 700; font-size: 1rem; }

  /* 迷路。列数は game.py が盤の大きさに合わせて入れる */
  #maze {
    display: grid;
    width: min(100%, 27rem);
    margin: 0 auto;
    border-radius: .35rem;
    overflow: hidden;
    touch-action: manipulation;
  }
  .cell { aspect-ratio: 1; position: relative; background: var(--dark); }
  .wall { background: var(--wall); }
  .floor { background: var(--floor); }
  .seen.wall { background: var(--wall); opacity: .45; }
  .seen.floor { background: var(--dim); }
  .player::after, .stairs::after { content: ""; position: absolute; inset: 18%; border-radius: 50%; }
  .player::after { background: var(--player); }
  .stairs::after { background: var(--goal); border-radius: .15rem; inset: 22%; }

  #message {
    margin: .75rem 0 0;
    text-align: center;
    font-weight: 700;
    color: var(--warn);
    min-height: 1.7em;
  }
  button {
    font-family: inherit;
    font-weight: 600;
    border: 0;
    border-radius: .5rem;
    cursor: pointer;
  }
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .4rem;
    width: 12rem;
    margin: .5rem auto 0;
  }
  .pad button {
    padding: .55rem 0;
    font-size: 1.0625rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .pad button:active { background: var(--line); }
  .pad .up { grid-column: 2; }
  .pad .left { grid-column: 1; }
  .pad .down { grid-column: 2; }
  .pad .right { grid-column: 3; }
  .modes { display: flex; gap: .4rem; margin-top: .75rem; align-items: center; }
  .modes .label { font-size: .8125rem; color: var(--muted); flex: none; }
  .mode {
    flex: 1;
    padding: .5rem 0;
    font-size: .875rem;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .mode.is-on { color: var(--panel); background: var(--accent); border-color: var(--accent); }
  .actions { display: flex; gap: .4rem; margin-top: .5rem; }
  .actions button {
    flex: 1;
    padding: .7rem;
    font-size: 1rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .actions button:disabled { opacity: .45; cursor: default; }
  #loading { color: var(--muted); font-size: .875rem; text-align: center; padding: .5rem 0; margin: .5rem 0 0; }
  .keys { font-size: .8125rem; color: var(--muted); text-align: center; margin: .75rem 0 0; }
  .back { font-size: .875rem; margin: 0 0 1rem; }
  .back a { color: var(--muted); text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .note { font-size: .875rem; color: var(--muted); margin-top: 1.5rem; }
  .note a { color: inherit; }
  footer { margin-top: 2rem; font-size: .8125rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="back"><a href="../">← 課題一覧</a></p>
  <h1>ダンジョン</h1>
  <p class="sub">部屋と廊下はランダムに作られ、見えたところだけが地図に残ります。黄色い階段を見つけて次の階へ。地下 5 階の階段でクリアです。</p>

  <div class="card">
    <div class="status">
      <span>地下 <b id="floor">1</b> 階</span>
      <span><b id="steps">0</b> 歩</span>
    </div>

    <div id="maze"></div>

    <p id="message"></p>

    <div class="pad">
      <button class="up" type="button" data-dir="up" tabindex="-1" aria-label="上へ">↑</button>
      <button class="left" type="button" data-dir="left" tabindex="-1" aria-label="左へ">←</button>
      <button class="down" type="button" data-dir="down" tabindex="-1" aria-label="下へ">↓</button>
      <button class="right" type="button" data-dir="right" tabindex="-1" aria-label="右へ">→</button>
    </div>

    <div class="actions">
      <button id="new-btn" type="button" disabled>はじめから</button>
    </div>

    <p class="keys">矢印キーで移動</p>
    <p id="loading">Python を読み込んでいます… （初回は数秒かかります）</p>
  </div>

  <p class="note">
    このページは <strong>Python のコードがブラウザの中でそのまま動いています</strong>（PyScript）。
    サーバーはなく、部屋の配置も廊下もすべて手元の端末で作られます。
  </p>

  <footer>
    ソース: <a href="https://github.com/hicocho/python-study">github.com/hicocho/python-study</a> ·
    <a href="https://github.com/hicocho/python-study/blob/main/docs/g19/game.py">このページの game.py</a> ·
    <a href="https://github.com/hicocho/python-study/blob/main/g19-dungeon/main.py">CLI 版 main.py</a>
  </footer>
</main>

<script type="py" src="./game.py"></script>
</body>
</html>
