<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイピングゲーム — python-study</title>
<meta name="description" content="表示された文章を5問打って、正解数と1秒あたりの文字数を測る。Python のコードがブラウザでそのまま動いています。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9000;</text></svg>">
<link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
<script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #656d76;
    --line: #d8dbe0;
    --accent: #2f6f4e;
    --warn: #9a6700;
    --lose: #b3261e;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --panel: #1f2229;
      --ink: #e6e6e3;
      --muted: #9aa2ad;
      --line: #333842;
      --accent: #7fc9a1;
      --warn: #e0b341;
      --lose: #ef8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 3rem;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: .875rem; margin: 0 0 1.5rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: .75rem;
    padding: 1.25rem;
  }
  .status { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .75rem; }
  .status strong { font-size: .875rem; font-weight: 600; }
  #progress { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
  #target {
    border: 1px solid var(--line);
    border-radius: .5rem;
    background: var(--bg);
    padding: 1rem .75rem;
    text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1.25rem;
    line-height: 1.4;
    word-break: break-word;
    min-height: 4.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #target.waiting { color: var(--muted); font-size: .9375rem; font-family: inherit; }
  #answer {
    width: 100%;
    margin-top: .5rem;
    padding: .7rem .75rem;
    border: 1px solid var(--line);
    border-radius: .5rem;
    background: var(--panel);
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1.0625rem;
  }
  #answer:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #answer:disabled { opacity: .45; }
  #log {
    height: 10rem;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: .5rem;
    padding: .75rem;
    background: var(--bg);
    font-size: .9375rem;
    margin-top: .75rem;
  }
  #log .line { margin: 0 0 .4rem; }
  #log .line:last-child { margin-bottom: 0; }
  #log .ok { color: var(--accent); font-weight: 700; }
  #log .miss { color: var(--lose); font-weight: 700; }
  #log .info { color: var(--muted); }
  #log .result { color: var(--warn); font-weight: 700; }
  #log code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .8125rem;
    color: var(--muted);
    font-weight: 400;
  }
  button {
    font-family: inherit;
    font-weight: 600;
    border: 0;
    border-radius: .5rem;
    cursor: pointer;
  }
  #start-btn {
    width: 100%;
    margin-top: .75rem;
    padding: .7rem;
    font-size: 1rem;
    color: var(--panel);
    background: var(--accent);
  }
  #start-btn:disabled { opacity: .45; cursor: default; }
  #loading { color: var(--muted); font-size: .875rem; text-align: center; padding: .5rem 0; }
  .back { font-size: .875rem; margin: 0 0 1rem; }
  .back a { color: var(--muted); text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .note { font-size: .875rem; color: var(--muted); margin-top: 1.5rem; }
  .note a { color: inherit; }
  footer { margin-top: 2rem; font-size: .8125rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="back"><a href="../">← 課題一覧</a></p>
  <h1>タイピングゲーム</h1>
  <p class="sub">表示された文章をそのまま打って Enter。全 5 問です。</p>

  <div class="card">
    <div class="status">
      <strong>進捗</strong>
      <span id="progress">準備中…</span>
    </div>

    <div id="target" class="waiting">スタートを押すと始まります</div>
    <input id="answer" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="ここに打つ" disabled>

    <div id="log"></div>
    <p id="loading">Python を読み込んでいます… （初回は数秒かかります）</p>

    <button id="start-btn" disabled>スタート</button>
  </div>

  <p class="note">
    このページは <strong>Python のコードがブラウザの中でそのまま動いています</strong>（PyScript）。
    サーバーはなく、計算はすべて手元の端末で行われます。
  </p>

  <footer>
    ソース: <a href="https://github.com/hicocho/python-study">github.com/hicocho/python-study</a> ·
    <a href="https://github.com/hicocho/python-study/blob/main/docs/g03/game.py">このページの game.py</a> ·
    <a href="https://github.com/hicocho/python-study/blob/main/g03-typing/main.py">CLI 版 main.py</a>
  </footer>
</main>

<script type="py" src="./game.py"></script>
</body>
</html>
