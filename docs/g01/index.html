<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数当てゲーム — python-study</title>
<meta name="description" content="1〜100 の数字を7回以内に当てるゲーム。Python のコードがブラウザでそのまま動いています。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127919;</text></svg>">
<link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
<script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #656d76;
    --line: #d8dbe0;
    --accent: #2f6f4e;
    --warn: #9a6700;
    --lose: #b3261e;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --panel: #1f2229;
      --ink: #e6e6e3;
      --muted: #9aa2ad;
      --line: #333842;
      --accent: #7fc9a1;
      --warn: #e0b341;
      --lose: #ef8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 3rem;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: .875rem; margin: 0 0 1.5rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: .75rem;
    padding: 1.25rem;
  }
  .status { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .75rem; }
  .status strong { font-size: .875rem; font-weight: 600; }
  #remaining { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
  #log {
    height: 15rem;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: .5rem;
    padding: .75rem;
    background: var(--bg);
    font-size: .9375rem;
  }
  #log .line { margin: 0 0 .4rem; }
  #log .line:last-child { margin-bottom: 0; }
  #log .warn { color: var(--warn); }
  #log .win  { color: var(--accent); font-weight: 700; }
  #log .lose { color: var(--lose); font-weight: 700; }
  .row { display: flex; gap: .5rem; margin-top: .75rem; }
  input[type="number"] {
    flex: 1;
    min-width: 0;
    padding: .6rem .75rem;
    font-size: 1rem;
    font-family: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: .5rem;
  }
  button {
    padding: .6rem 1.1rem;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 600;
    color: var(--bg);
    background: var(--accent);
    border: 0;
    border-radius: .5rem;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  #again-btn { width: 100%; margin-top: .75rem; }
  #loading { color: var(--muted); font-size: .875rem; text-align: center; padding: .5rem 0; }
  .back { font-size: .875rem; margin: 0 0 1rem; }
  .back a { color: var(--muted); text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .note { font-size: .875rem; color: var(--muted); margin-top: 1.5rem; }
  .note a { color: inherit; }
  footer { margin-top: 2rem; font-size: .8125rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="back"><a href="../">← 課題一覧</a></p>
  <h1>数当てゲーム</h1>
  <p class="sub">1〜100 の数字を 7 回以内に当ててください。</p>

  <div class="card">
    <div class="status">
      <strong>ヒント</strong>
      <span id="remaining">準備中…</span>
    </div>

    <div id="log"></div>
    <p id="loading">Python を読み込んでいます… （初回は数秒かかります）</p>

    <div class="row">
      <input type="number" id="guess" min="1" max="100" placeholder="1〜100 の数字" disabled inputmode="numeric">
      <button id="guess-btn" disabled>送信</button>
    </div>

    <button id="again-btn" hidden>もう一度あそぶ</button>
  </div>

  <p class="note">
    このページは <strong>Python のコードがブラウザの中でそのまま動いています</strong>（PyScript）。
    サーバーはなく、計算はすべて手元の端末で行われます。
  </p>

  <footer>
    ソース: <a href="https://github.com/hicocho/python-study">github.com/hicocho/python-study</a> ·
    <a href="https://github.com/hicocho/python-study/blob/main/docs/g01/game.py">このページの game.py</a> ·
    <a href="https://github.com/hicocho/python-study/blob/main/g01-number-guess/main.py">CLI 版 main.py</a>
  </footer>
</main>

<script type="py" src="./game.py"></script>
</body>
</html>
