<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テトリス — python-study</title>
<meta name="description" content="矢印キーで遊ぶテトリス。落下・回転・ライン消去のロジックは CLI 版と同じ Python がブラウザでそのまま動いています。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129513;</text></svg>">
<link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
<script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #656d76;
    --line: #d8dbe0;
    --accent: #2f6f4e;
    --warn: #9a6700;
    --empty: #eceef1;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --panel: #1f2229;
      --ink: #e6e6e3;
      --muted: #9aa2ad;
      --line: #333842;
      --accent: #7fc9a1;
      --warn: #e0b341;
      --empty: #23262d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 3rem;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: .875rem; margin: 0 0 1.5rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: .75rem;
    padding: 1.25rem;
  }
  .status { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .75rem; }
  .status strong { font-size: .875rem; font-weight: 600; }
  .status span { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
  .status b { color: var(--ink); font-weight: 700; }
  #grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 1px;
    width: min(100%, 15rem);
    margin: 0 auto;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: .5rem;
    background: var(--line);
  }
  .cell { aspect-ratio: 1; background: var(--empty); border-radius: 1px; }
  .c-I { background: #4aa3c7; }
  .c-O { background: #d4a72c; }
  .c-T { background: #9a6bd4; }
  .c-S { background: #4aa96c; }
  .c-Z { background: #d4685e; }
  .c-J { background: #4a72c7; }
  .c-L { background: #d4894a; }
  #message {
    margin: .75rem 0 0;
    text-align: center;
    font-weight: 700;
    color: var(--warn);
  }
  .pad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: .4rem;
    margin-top: .75rem;
  }
  button {
    font-family: inherit;
    font-weight: 600;
    border: 0;
    border-radius: .5rem;
    cursor: pointer;
  }
  .pad button {
    padding: .6rem 0;
    font-size: 1.0625rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .pad button:active { background: var(--line); }
  #start-btn {
    width: 100%;
    margin-top: .75rem;
    padding: .7rem;
    font-size: 1rem;
    color: var(--panel);
    background: var(--accent);
  }
  #start-btn:disabled { opacity: .45; cursor: default; }
  #loading { color: var(--muted); font-size: .875rem; text-align: center; padding: .5rem 0; margin: .5rem 0 0; }
  .keys { font-size: .8125rem; color: var(--muted); text-align: center; margin: .75rem 0 0; }
  .back { font-size: .875rem; margin: 0 0 1rem; }
  .back a { color: var(--muted); text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .note { font-size: .875rem; color: var(--muted); margin-top: 1.5rem; }
  .note a { color: inherit; }
  footer { margin-top: 2rem; font-size: .8125rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="back"><a href="../">← 課題一覧</a></p>
  <h1>テトリス</h1>
  <p class="sub">矢印キーで操作します。0.8 秒ごとに 1 マス落ちて、横 1 列そろうと消えます。</p>

  <div class="card">
    <div class="status">
      <strong>スコア <b id="score">0</b></strong>
      <span>消した列 <b id="lines">0</b></span>
    </div>

    <div id="grid"></div>

    <p id="message" hidden></p>

    <div class="pad">
      <button id="left-btn" type="button" tabindex="-1" aria-label="左へ">←</button>
      <button id="turn-btn" type="button" tabindex="-1" aria-label="回す">↻</button>
      <button id="right-btn" type="button" tabindex="-1" aria-label="右へ">→</button>
      <button id="down-btn" type="button" tabindex="-1" aria-label="1つ落とす">↓</button>
      <button id="drop-btn" type="button" tabindex="-1" aria-label="一気に落とす">⤓</button>
    </div>

    <p class="keys">← → 移動 / ↑ 回転 / ↓ 落下 / スペース 一気に</p>
    <p id="loading">Python を読み込んでいます… （初回は数秒かかります）</p>

    <button id="start-btn" disabled>スタート</button>
  </div>

  <p class="note">
    このページは <strong>Python のコードがブラウザの中でそのまま動いています</strong>（PyScript）。
    サーバーはなく、計算はすべて手元の端末で行われます。
  </p>

  <footer>
    ソース: <a href="https://github.com/hicocho/python-study">github.com/hicocho/python-study</a> ·
    <a href="https://github.com/hicocho/python-study/blob/main/docs/g04/game.py">このページの game.py</a> ·
    <a href="https://github.com/hicocho/python-study/blob/main/g04-tetris/main.py">CLI 版 main.py</a>
  </footer>
</main>

<script type="py" src="./game.py"></script>
</body>
</html>
